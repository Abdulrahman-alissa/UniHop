# Render Blueprint: creates the API and a PostgreSQL database in one step.
# Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: unihop-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: unihop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set to your frontend URL, e.g. https://unihop-black.vercel.app
      - key: AUTO_SEED
        value: "false"
databases:
  - name: unihop-db
    plan: free
